services:
  app:
    build: .
    command: ["web"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-sqlite}
    volumes:
      - ./db:/app/prisma/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-sqlite}
    volumes:
      - ./db:/app/prisma/data
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
        required: false

  # Only started when DB_PROVIDER=mysql and you run:
  #   docker compose --profile mariadb up
  db:
    image: mariadb:11
    profiles: ["mariadb"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: anisync
      MARIADB_USER: anisync
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-anisync}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme}
    volumes:
      - ./db/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
